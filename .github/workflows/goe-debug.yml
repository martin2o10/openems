name: go-e debug
on:
  push:
    branches:
      - ci-debug
jobs:
  test-goe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Test go-e bundle
        run: ./gradlew :io.openems.edge.evse.chargepoint.goe:test --console=plain > build-output.txt 2>&1 || true
      - name: Report errors as annotations
        run: |
          grep -nE "error:|FAILED|Exception|expected|AssertionFailed|What went wrong" build-output.txt | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
          for f in $(find . -path "*test-results*" -name "*.xml"); do grep -oE '<failure message="[^"]{0,600}' "$f" | head -10 | while IFS= read -r l; do echo "::error file=$f::${l//%/%25}"; done; done
